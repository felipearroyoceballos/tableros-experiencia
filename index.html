<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tableros Experiencia Americar</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--line:#dde1e8;--fg:#10141c;--fg-2:#4a5160;--accent:#1c5cab}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--surface:#171b23;--line:#2a303b;--fg:#e8eaee;--fg-2:#a3aab7;--accent:#6ea2e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:640px}
h1{font-size:1.5rem;margin:0 0 4px}
p{color:var(--fg-2);margin:0 0 24px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;color:inherit;text-decoration:none;transition:border-color .15s}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.card b{display:block;font-size:1.1rem;margin-bottom:4px;color:var(--accent)}
.card span{color:var(--fg-2);font-size:.9rem}
footer{margin-top:24px;color:var(--fg-2);font-size:.8rem}
</style>
<main>
  <h1>Experiencia de Clientes · Grupo Americar</h1>
  <p>Tableros de NPS y gestión. Se actualizan lunes, miércoles y viernes.</p>
  <div class="grid">
    <a class="card" href="tablero_VN.html"><b>Venta Nuevos</b><span>NPS, atributos, insights y checklist de entrega</span></a>
    <a class="card" href="tablero_PV.html"><b>Postventa</b><span>NPS de Mantención, Reparación y DyP</span></a>
  </div>
  <footer>Uso interno.</footer>
</main>
</html>
